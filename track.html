<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#56308a"><title>Track Order — ASTRI</title><style>:root{--p:#56308a;--lav:#8b5cc7;--bg:#f7f2fc;--ink:#302044;--muted:#81748f;--line:#e9def4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,Arial}.wrap{max-width:760px;margin:auto;padding:28px 20px}.brand{font-size:27px;font-weight:900;letter-spacing:3px;color:var(--p)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.btn{padding:13px 18px;border:0;border-radius:10px;background:var(--p);color:white;font-weight:800}.steps{display:grid;gap:14px;margin-top:24px}.step{display:flex;gap:14px;align-items:center;padding:14px;background:#fbf9fe;border:1px solid var(--line);border-radius:12px}.dot{width:14px;height:14px;border-radius:50%;background:#d7c6e9}.note{font-size:13px;color:var(--muted);line-height:1.5}</style></head><body><main class="wrap"><a href="/" style="text-decoration:none"><div class="brand">ASTRI</div></a><section class="card"><h1>Track your order</h1><p class="note">Enter your order ID to view delivery progress. Live status requires the order database and delivery updates to be connected.</p><form id="track"><input class="field" required placeholder="e.g. ASTRI-100245" aria-label="Order ID"><button class="btn">Find order</button></form><div id="result" class="note" role="status" style="margin-top:16px"></div><div class="steps"><div class="step"><span class="dot"></span>Order confirmed</div><div class="step"><span class="dot"></span>Preparing your order</div><div class="step"><span class="dot"></span>Rider assigned</div><div class="step"><span class="dot"></span>Out for delivery</div><div class="step"><span class="dot"></span>Delivered</div></div></section></main><script>document.getElementById('track').addEventListener('submit',e=>{e.preventDefault();document.getElementById('result').textContent='Tracking service is being connected. No live order status is available yet.'})</script></body></html>
